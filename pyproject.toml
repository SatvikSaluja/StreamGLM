[project]
name = "streamglm"
version = "0.3.0"
description = "Memory-bounded causal population GLMs with JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jax>=0.4.30",
]

[project.optional-dependencies]
validation = ["nemos>=0.2.8"]
io = ["pynapple>=0.10", "pynwb>=2.0"]
plots = ["matplotlib>=3.7"]

[project.scripts]
streamglm = "streamglm.cli:main"

[tool.setuptools.packages.find]
include = ["streamglm*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
